<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Lista de Tarefas Moderna</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth transitions */
        .task-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">TaskMaster</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Organize seu dia com eficiência</p>
                </div>
            </div>
            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" aria-label="Alternar Tema" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 space-y-6">

        <!-- Task Form Card -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Nova Tarefa</h2>
            <form id="taskForm" class="space-y-4">
                <div class="relative">
                    <input type="text" id="taskTitle" required placeholder="O que você precisa fazer?" 
                        class="w-full pl-4 pr-10 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    <div class="absolute right-3 top-3.5 text-slate-400">
                        <i class="fa-solid fa-pen"></i>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Category Selection -->
                    <div>
                        <label for="taskCategory" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Categoria</label>
                        <select id="taskCategory" class="w-full py-2.5 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <option value="Trabalho">Trabalho</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label for="taskDate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Data de Vencimento (Opcional)</label>
                        <input type="date" id="taskDate" class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Adicionar Tarefa</span>
                </button>
            </form>
        </section>

        <!-- Statistics & Filters -->
        <section class="space-y-4">
            <!-- Counters -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Pendentes</p>
                        <h3 id="pendingCount" class="text-2xl font-bold text-amber-500">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Concluídas</p>
                        <h3 id="completedCount" class="text-2xl font-bold text-emerald-500">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>
            </div>

            <!-- Filters Bar -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-2 rounded-2xl">
                <div class="flex items-center space-x-1 w-full sm:w-auto overflow-x-auto">
                    <button data-filter="all" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-emerald-500 text-white">Todas</button>
                    <button data-filter="pending" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">Pendentes</button>
                    <button data-filter="completed" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">Concluídas</button>
                </div>
                <!-- Search or Actions if needed -->
                <button id="clearCompletedBtn" class="text-xs text-red-500 hover:text-red-600 font-medium px-3 py-2 transition-colors hidden sm:block">
                    Limpar Concluídas
                </button>
            </div>
        </section>

        <!-- Task List -->
        <section>
            <div id="taskList" class="space-y-3">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-12 text-center">
                <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center text-slate-400 mb-3 text-2xl">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <h3 class="font-medium text-slate-700 dark:text-slate-300">Nenhuma tarefa encontrada</h3>
                <p class="text-xs text-slate-400 mt-1">Adicione uma nova tarefa acima para começar.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 text-xs text-slate-400 dark:text-slate-600 border-t border-slate-200 dark:border-slate-800 mt-auto">
        TaskMaster &bull; Organizado com HTML, Tailwind e JavaScript
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // DOM Elements
        const taskForm = document.getElementById('taskForm');
        const taskTitleInput = document.getElementById('taskTitle');
        const taskCategoryInput = document.getElementById('taskCategory');
        const taskDateInput = document.getElementById('taskDate');
        const taskListEl = document.getElementById('taskList');
        const emptyStateEl = document.getElementById('emptyState');
        const pendingCountEl = document.getElementById('pendingCount');
        const completedCountEl = document.getElementById('completedCount');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');

        // App State
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';

        // Category Color Mapping
        const categoryColors = {
            'Trabalho': 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-blue-800',
            'Pessoal': 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-200 dark:border-purple-800',
            'Estudos': 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800',
            'Outros': 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-800'
        };

        // Initialize Theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // Toggle Theme Handler
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
        });

        // Save Tasks to LocalStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateCounters();
        }

        // Update Statistics Counters
        function updateCounters() {
            const pending = tasks.filter(t => !t.completed).length;
            const completed = tasks.filter(t => t.completed).length;
            pendingCountEl.textContent = pending;
            completedCountEl.textContent = completed;
        }

        // Format Date for Display
        function formatDate(dateString) {
            if (!dateString) return null;
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        // Render Task List
        function renderTasks() {
            taskListEl.innerHTML = '';
            
            // Filter tasks based on current filter state
            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'pending') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (filteredTasks.length === 0) {
                emptyStateEl.classList.remove('hidden');
            } else {
                emptyStateEl.classList.add('hidden');
            }

            filteredTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-item bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-sm opacity-0 translate-y-2`;
                
                const formattedDate = formatDate(task.date);
                const categoryClass = categoryColors[task.category] || 'bg-slate-500/10 text-slate-600 border-slate-200';

                item.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1 min-w-0 pr-3">
                        <button onclick="toggleTask(${task.id})" aria-label="Marcar como concluída" class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all flex-shrink-0 ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-emerald-500'}">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-medium truncate ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">${escapeHtml(task.title)}</p>
                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md border ${categoryClass}">${task.category}</span>
                                ${formattedDate ? `<span class="text-[10px] text-slate-400 flex items-center space-x-1"><i class="fa-regular fa-calendar mr-1"></i>${formattedDate}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTask(${task.id})" aria-label="Excluir tarefa" class="w-9 h-9 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 flex items-center justify-center transition-colors flex-shrink-0">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;

                taskListEl.appendChild(item);

                // Trigger smooth entrance animation
                setTimeout(() => {
                    item.classList.remove('opacity-0', 'translate-y-2');
                }, 10);
            });
        }

        // Add Task Handler
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskTitleInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now(),
                title: title,
                category: taskCategoryInput.value,
                date: taskDateInput.value,
                completed: false
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();

            // Reset Form Inputs
            taskTitleInput.value = '';
            taskDateInput.value = '';
            taskTitleInput.focus();
        });

        // Toggle Task Status
        window.toggleTask = function(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        };

        // Delete Task
        window.deleteTask = function(id) {
            const itemElement = document.querySelector(`button[onclick="deleteTask(${id})"]`).closest('.task-item');
            if (itemElement) {
                itemElement.classList.add('opacity-0', '-translate-x-4');
                setTimeout(() => {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                }, 300);
            } else {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
            }
        };

        // Filter Buttons Event Listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-emerald-500', 'text-white');
                    b.classList.add('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
                });
                const target = e.currentTarget;
                target.classList.add('bg-emerald-500', 'text-white');
                target.classList.remove('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
                
                currentFilter = target.getAttribute('data-filter');
                renderTasks();
            });
        });

        // Clear Completed Tasks
        clearCompletedBtn.addEventListener('click', () => {
            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            renderTasks();
        });

        // Helper to sanitize text output
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initial Render on Page Load
        renderTasks();
        updateCounters();
    </script>
</body>
</html>
